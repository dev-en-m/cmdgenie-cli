name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Auto-bump: if package.json version is not ahead of npm, publish latest npm version + patch.
      # Bumped version is not committed back; bump package.json manually for minor/major releases.
      - name: Bump version
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUB=$(npm view "$NAME" version 2>/dev/null || true)
          if [ -n "$PUB" ] && [ "$(printf '%s\n%s\n' "$PUB" "$LOCAL" | sort -V | tail -1)" = "$PUB" ]; then
            npm version "$PUB" --no-git-tag-version --allow-same-version
            npm version patch --no-git-tag-version
          fi
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
